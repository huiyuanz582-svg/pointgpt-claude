# ======================================================
# PointGPT-L Fine-tuning Configuration for Denoising Task
# Using paired noisy-clean dataset (e.g., PD-Flow, PUSet, DMRSet)
# ======================================================

optimizer: 
  { type: AdamW, kwargs: { lr: 0.00003, weight_decay: 0.05 } }

scheduler: 
  { type: CosLR, kwargs: { epochs: 120, initial_epochs: 8 } }
dataset:
  {
    train:
      {
        _base_: cfgs/dataset_configs/ScoreDenoise.yaml,
        others: { subset: "train" },
      },
    val:
      {
        _base_: cfgs/dataset_configs/ScoreDenoise.yaml,
        others: { subset: "val" },
      },
    test:
      {
        _base_: cfgs/dataset_configs/ScoreDenoise.yaml,
        others: { subset: "test" },
      },
  }

model:
  {
    NAME: PointTransformer,
    cls_dim: 15,  #分类任务类别数，去噪任务可设为任意值
    trans_dim: 384,
    depth: 12,
    drop_path_rate: 0.1,
    num_heads: 6,
    group_size: 32,
    num_group: 2048, #10k
    # num_group_10k: 315, #10k
    # num_group_30k: 938, #10k
    # num_group_50k: 1575, #50k
    encoder_dims: 384,
    decoder_depth: 4,
    loss: cdl12,      # 常用去噪损失（Chamfer Distance L2）
    weight_center: 1.0,          # 可调的重建权重
  }

npoints: 2048                 # 每个点云的采样点数
total_bs: 32                     # 总批次大小
step_per_update: 1
max_epoch: 120
grad_norm_clip: 10
save_interval: 10
val_interval: 1

pretrain: pretrainModel/S/pretrained.pth   # 指定预训练模型路径

exp_name: finetune_denoise_pointGPT
