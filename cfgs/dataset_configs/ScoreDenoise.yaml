NAME: ScoreDenoise
ROOT: data/ScoreDenoise
NOISE_MIN: 0.005
NOISE_MAX: 0.020
VAL_NOISE: 0.010
# TEST_NOISE: val/test 路径 noise_std 的 fallback（PairedEvalDataset 不含 noise_std 字段）
# 跑 3% noise 测试时改为 0.030
TEST_NOISE: 0.010
# 测试用分辨率和带噪目录名（改这里换 10k/50k 以及噪声水平，无需改代码）
TEST_RESOLUTION: 10000_poisson
TEST_NOISY_DIR: PUNet_10000_poisson_0.01
AUG_ROTATE: True
DATASET: PUNet
RESOLUTIONS: ['10000_poisson','30000_poisson','50000_poisson']
# 每个训练样本：从 10k/30k/50k 任一干净点云中随机种子点 + KNN 取固定大小 patch
# 1024 与 PointGPT-S pretrain 的 npoints 对齐；让 num_group=64, group_size=32 复用预训练
PATCH_SIZE: 1024
NUM_PATCHES: 1
# TRAIN_BATCH_SIZE 会被主配置里的 total_bs 覆盖（tools/builder.py 里同步）
TRAIN_BATCH_SIZE: 32
NUM_WORKERS: 4
# 训练时每张点云的过采样倍数（每 epoch 用同一张点云切多个不同 patch）
# 原始 120 张 / batch 32 = 3 step/epoch，远远不够；50× 后约 187 step/epoch
TRAIN_OVERSAMPLE: 50