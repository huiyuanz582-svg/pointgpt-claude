NAME: ScoreDenoise
ROOT: data/ScoreDenoise
NOISE_MIN: 0.005
NOISE_MAX: 0.020
# σ 对数均匀采样(EDM 式)：范围不变，小 σ 样本占比更高，精细去噪/降 P2M 更充分
NOISE_LOG_UNIFORM: True
VAL_NOISE: 0.010
# TEST_NOISE: val/test 路径 noise_std 的 fallback（PairedEvalDataset 不含 noise_std 字段）
# 跑 3% noise 测试时改为 0.030
TEST_NOISE: 0.010
# 测试用分辨率和带噪目录名（改这里换 10k/50k 以及噪声水平，无需改代码）
TEST_RESOLUTION: 10000_poisson
TEST_NOISY_DIR: PUNet_10000_poisson_0.01
# 泛化实验换测试集（三个路径都可选；不设=用 PUNet 默认）。clean/noisy/mesh 文件名要互相同名、
# 且 noisy 与 clean 同分辨率（同点数）。换噪声/分辨率时改 TEST_RESOLUTION + TEST_NOISE + TEST_NOISY_PATH。
#   TEST_NOISY_PATH: 直接装着带噪 .xyz 的文件夹（覆盖默认 examples/.../<TEST_NOISY_DIR>）
#   TEST_CLEAN_PATH: 干净点云根目录，其下应有 <分辨率>/ 子目录（干净目录 = <它>/<TEST_RESOLUTION>）
#   TEST_MESH_ROOT:  P2M mesh 根目录，其下应有 test/<name>.off（compute_p2m 用 <它>/test/<name>.off）
# —— 换成 PCNet（图示，按需改分辨率/噪声）：
# TEST_NOISY_PATH: /home/sapi/zhy/compare_methods/PCNet/noisy/PCNet_10000_poisson_0.01
# TEST_CLEAN_PATH: /home/sapi/zhy/compare_methods/PCNet/pointclouds/test
# TEST_MESH_ROOT:  /home/sapi/zhy/compare_methods/PCNet/meshes
AUG_ROTATE: True
DATASET: PUNet
RESOLUTIONS: ['10000_poisson','30000_poisson','50000_poisson']
# 每个训练样本：从 10k/30k/50k 任一干净点云中随机种子点 + KNN 取固定大小 patch
# 1024 与 PointGPT-S pretrain 的 npoints 对齐；让 num_group=64, group_size=32 复用预训练
PATCH_SIZE: 1024
NUM_PATCHES: 1
# TRAIN_BATCH_SIZE 会被主配置里的 total_bs 覆盖（tools/builder.py 里同步）
TRAIN_BATCH_SIZE: 32
NUM_WORKERS: 4
# 训练时每张点云的过采样倍数（每 epoch 用同一张点云切多个不同 patch）
# 原始 120 张 / batch 32 = 3 step/epoch，远远不够；50× 后约 187 step/epoch
TRAIN_OVERSAMPLE: 50

# ===== 验证集设置 =====
# validate() 统一跑 test 同款 pipeline（整云→Langevin→拼接→SOR）算 CD+P2M，按 cd+0.3*p2m
# 选 ckpt-best（选模型标准 = 报告标准）。整云 30 步较慢，建议训练时 --val_freq 5。
#
# VAL_NUM = 0（默认，推荐做对比实验）：不留出，训练用满 train split（40 shape 全用），
#   验证看 test split —— 与 ScoreDenoise / PD-Flow 完全一致（它们也 train 全用、val 看 test），
#   训练数据量与选模型协议都对齐 baseline → 公平对比。（注：这是该 benchmark 的通行惯例。）
# VAL_NUM > 0：从 train 确定性留出这么多 shape 作独立验证并排除出训练（方法学更干净、
#   无 test 泄漏，但训练数据变少、且偏离 baseline 协议 —— 只在需要"严格无泄漏"时用）。
VAL_NUM: 0                     # 0=对齐 baseline（验证看 test）；>0=从 train 留出这么多做独立验证
VAL_SPLIT_SEED: 2024          # 留出划分随机种子（仅 VAL_NUM>0 时用；固定→可复现）
VAL_RESOLUTION: 10000_poisson # 验证分辨率（单一，与主基准对齐）
VAL_NOISE_LEVELS: [0.01]      # 验证噪声级（固定、可复现）；想跨噪声更鲁棒可设 [0.01, 0.02, 0.03]（成倍耗时）