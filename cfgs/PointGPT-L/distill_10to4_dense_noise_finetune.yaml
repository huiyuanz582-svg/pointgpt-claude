# Dense/noisy training patches: input-matched local Teacher supervision + frozen Student endpoint.
# Initialize from the existing one-epoch local + endpoint Student checkpoint.
model:
  NAME: PointTransformer
  cls_dim: 15
  trans_dim: 1024
  depth: 24
  drop_path_rate: 0.2
  num_heads: 16
  group_size: 32
  num_group: 128
  encoder_dims: 1024
  decoder_depth: 4
  loss: cdl12
  weight_center: 1.0

dataset:
  _base_: cfgs/dataset_configs/ScoreDenoise.yaml

curriculum_mode: fixed
distillation:
  teacher_nodes: [0, 2, 5, 7, 10]
  teacher_steps: 10
  teacher_eta: 0.3
  teacher_decay: 0.95
  student_steps: 4
  student_eta: 1.0
  student_decay: [0.9025, 0.8573749999999999, 0.9025, 0.8573749999999999]

pcd_dynamic:
  shadow_enabled: false

total_bs: 8
epochs: 1
learning_rate: 0.0000005
weight_decay: 0.0
grad_norm_clip: 1.0
inference_patch_size: 1024
seed_ratio: 3
fuse_tau_ratio: 0.5
teacher_patch_batch: 1
student_patch_batch: 8
test_patch_batch: 1
cpu_threads: 8
gpu_mem_fraction: 0.9
gpu_mem_limit_gib: 48
gpu_mem_headroom_gib: 1
validation_seed: 2024
validation_patches_per_cloud: 4
rollout_val_interval: 1

sor_enable: false
surface_projection: {enable: false, k: 16, num_iters: 1, blend: 0.6}

endpoint_finetune:
  patch_batch: 1
  gradient_checkpointing: true
  freeze_pre_bn_conv_bias: true
  # L = mean(patch_weight * L_local + L_reference_endpoint).
  local_weight: 1.0
  endpoint_weight: 1.0
  dense_noise_adaptation:
    min_source_points: 50000
    noise_ramp_start: 0.0125
    noise_ramp_end: 0.0200
    reference_sha256: 94da5dd125e92bec221bb3a9a72b0896ca48eaef86c05bd057516517950e5a12
