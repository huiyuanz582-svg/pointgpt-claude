# ======================================================
# PointGPT-L Fine-tuning Configuration for Denoising Task
# Using paired noisy-clean dataset (e.g., PD-Flow, PUSet, DMRSet)
# ======================================================

optimizer: 
  { type: AdamW, kwargs: { lr: 0.0001, weight_decay: 0.05 } }

scheduler: 
  { type: CosLR, kwargs: { epochs: 300, initial_epochs: 10 } }

dataset:
  {
    train:
      {
        _base_: cfgs/dataset_configs/ScoreDenoise.yaml,
        others: { subset: "train" },
      },
    val:
      {
        _base_: cfgs/dataset_configs/ScoreDenoise.yaml,
        others: { subset: "val" },
      },
    test:
      {
        _base_: cfgs/dataset_configs/ScoreDenoise.yaml,
        others: { subset: "test" },
      },
  }

model:
  {
    NAME: PointTransformer,
    cls_dim: 15,  #分类任务类别数，去噪任务可设为任意值
    trans_dim: 1024,
    depth: 24,
    drop_path_rate: 0.2,
    num_heads: 16,
    group_size: 32,
    num_group: 512,
    encoder_dims: 1024,
    decoder_depth: 4,
    loss: cdl12,      # 常用去噪损失（Chamfer Distance L2）
  }

npoints: 2048                    # 每个点云的采样点数
total_bs: 64                    # 总批次大小
step_per_update: 1
max_epoch: 300
grad_norm_clip: 10
save_interval: 10
val_interval: 1

pretrain: pretrainModel/L/post_pretrained.pth   # 指定预训练模型路径

exp_name: finetune_denoise_pointGPT
