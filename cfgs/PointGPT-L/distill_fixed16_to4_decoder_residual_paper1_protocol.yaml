# Stage 1 v5 official training budget.  Run this only if the 5x quick config
# improves on its own student-initial baseline by a useful margin.
_base_: cfgs/PointGPT-L/distill_fixed16_to4_decoder_residual.yaml

scheduler:
  { type: CosLR, kwargs: { epochs: 30, initial_epochs: 2 } }

max_epoch: 30

distillation:
  {
    progress_log_interval: 500,
    early_stop_patience: 5,
  }

dataset:
  train:
    _base_:
      TRAIN_OVERSAMPLE: 50

